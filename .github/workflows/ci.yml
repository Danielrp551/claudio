name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "not formatted:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The race detector needs cgo and a working 64 bit C compiler, which is
      # the default on the Linux and macOS runners and not on the Windows one.
      # Windows still runs every test, without the detector.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The action major has to match the configuration format. .golangci.yml
      # declares version 2, which only golangci-lint v2 understands, and only
      # action v7 and later install it. The linter version is pinned rather than
      # left as latest so a release upstream cannot turn a green branch red on
      # its own, and so the version here is the one contributors run locally.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  tidy:
    name: module is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go mod tidy
      - name: Fail if the module files changed
        run: git diff --exit-code go.mod
